aid: kandji
name: Iru
x-former-name: Kandji
description: >-
  Iru (formerly Kandji) is a San Francisco based endpoint management and security company whose
  AI-powered platform unifies workforce identity and access, cross-platform endpoint management for
  macOS, iOS, iPadOS, tvOS, visionOS, Windows and Android, endpoint detection and response,
  vulnerability management, compliance automation and a customer-facing trust center behind a single
  agent. The company rebranded from Kandji to Iru on 22 October 2025; the product surface, the
  developer documentation and the API hostnames still carry the kandji.io domain. The Iru Endpoint
  Management API is a tenant-scoped REST API published as OpenAPI 3.0.0 and as a public Postman
  collection, covering devices and device actions, Blueprints, Library Items, Prism inventory
  reporting, Automated Device Enrollment, tags, users, threats and vulnerabilities, and it also backs
  a hosted, tenant-scoped Model Context Protocol server for AI assistants.
