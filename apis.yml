apis:
- name: Iru MCP Server
  description: >-
    Hosted, tenant-scoped Model Context Protocol server that exposes the Iru Enterprise API surface as
    MCP tools for Claude Desktop, Cursor, OpenAI Codex and other MCP clients. Enabled per API token with
    the "Enable MCP" switch in Access; authenticated with an X-API-Key header carrying an sk_live: prefixed
    key plus an X-MCP-Profile header, and constrained by the same per-endpoint API permissions and the
    same 10,000 requests/hour tenant rate limit as REST.
