x-name-discrepancy: >-
  The harvest backlog recorded this company as "Iru" against slug "kandji". Both are correct at
  different points in time: the authoritative current legal and brand name is Iru, Inc. (iru.com,
  confirmed on the live site and in the Platform Services Agreement), and Kandji is the former name
  retained in the slug, in the api.kandji.io API hostnames, in the api-docs.kandji.io reference, in
  the status.kandji.io status page, in the kandji-inc GitHub organization and in the io.kandji macOS
  logging subsystems. kandji.com does not redirect to iru.com (it answered HTTP 405 to a HEAD probe
  on 2026-08-01); the live company site is www.iru.com. The Forge Global secondary-market listing at
  forgeglobal.com/kandji_stock/ is still filed under the Kandji name and returned HTTP 403 to
  automated fetches. Slug retained as `kandji` for catalog continuity.
