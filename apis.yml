apis:
- name: Iru Endpoint Management API
  description: >-
    Tenant-scoped REST API for the Iru (formerly Kandji) endpoint platform. 121 operations across 94
    paths covering device inventory and details, 18 device actions (lock, erase, restart, shutdown,
    lost mode, clear passcode, renew MDM profile and more), device secrets (FileVault recovery key,
    bypass code, unlock PIN, recovery password), Blueprints and Blueprint library-item assignment,
    Library Items (custom apps, in-house IPA apps, custom profiles, custom scripts, Self Service
    categories), Prism inventory reporting and export, Automated Device Enrollment integrations,
    tags, users, audit events, behavioral detections, threat details and vulnerability management.
    Authentication is a tenant-level bearer token created in Access with per-endpoint permissions.
  humanURL: https://api-docs.kandji.io/
  baseURL: https://your-subdomain.api.kandji.io
  tags:
  - device-management
  - mobile-device-management
  - apple-management
  - endpoint-security
  - vulnerability-management
  - it-operations
  properties:
  - type: OpenAPI
    url: openapi/kandji-endpoint-management-openapi.json
  - type: Documentation
    url: https://docs.iru.com/en/endpoint/api/iru-api-overview
  - type: APIReference
    url: https://api-docs.kandji.io/
  - type: Postman
    url: https://api-docs.kandji.io/
  - type: PostmanCollection
    url: collections/kandji-endpoint-management.postman_collection.json
  - type: Authentication
    url: authentication/kandji-authentication.yml
  - type: Conventions
    url: conventions/kandji-conventions.yml
  - type: ErrorCatalog
    url: errors/kandji-problem-types.yml
  - type: DataModel
    url: data-model/kandji-data-model.yml
  - type: RateLimits
    url: rate-limits/kandji-rate-limits.yml
  - type: Overlay
    url: overlays/kandji-endpoint-management-overlay.yaml
- name: Iru Library Item Upload API
  description: >-
    Single-operation S3 pre-signed upload contract returned by the Custom App and IPA App creation
    endpoints of the Iru Endpoint Management API. The upload URL is variable per request; the
    provider publishes it as a separate OpenAPI document.
  humanURL: https://api-docs.kandji.io/
  baseURL: https://your-subdomain.api.kandji.io
  tags:
  - device-management
  - file-upload
  properties:
  - type: OpenAPI
    url: openapi/kandji-upload-to-s3-openapi.json
  - type: APIReference
    url: https://api-docs.kandji.io/
- name: Iru MCP Server
  description: >-
    Hosted, tenant-scoped Model Context Protocol server that exposes the Iru Enterprise API surface
    as MCP tools for Claude Desktop, Cursor, OpenAI Codex and other MCP clients. Enabled per API
    token with the "Enable MCP" switch in Access; authenticated with an X-API-Key header carrying an
    sk_live: prefixed key plus an X-MCP-Profile header, and constrained by the same per-endpoint API
    permissions and the same 10,000 requests/hour tenant rate limit as REST.
  humanURL: https://docs.iru.com/en/endpoint/integrations/ai-assistants/iru-mcp
  baseURL: https://your-tenant.connect.iru.com/mcp-server/connector/kandji/tools
  tags:
  - mcp
  - agent-native
  - device-management
  - endpoint-security
  properties:
  - type: MCPServer
    url: mcp/kandji-mcp.yml
  - type: ToolCrosswalk
    url: mcp/kandji-tool-crosswalk.yml
  - type: Documentation
    url: https://docs.iru.com/en/endpoint/integrations/ai-assistants/iru-mcp
