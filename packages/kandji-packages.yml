notes: >-
  Iru (formerly Kandji) publishes no conventional per-language REST client SDK (no first-party
  JavaScript, Go, Java, Ruby, PHP or Rust client). What it does publish, first-party under the
  kandji-inc GitHub organization, is a set of Python admin/automation tools distributed on PyPI,
  plus a large Shell/Python support-script repository. Registries probed with no first-party hit:
  npm, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist, crates.io.
