  EMPTY BY DESIGN — NOT A GAP TO PAPER OVER. Iru publishes no MCP tool list anywhere: not in the
  docs, not in either llms.txt, not in a registry entry. A live tools/list probe on 2026-08-01
  returned HTTP 401 {"detail":"Unauthorized"} against the documented tenant endpoint pattern, so the
  real tool names and inputSchemas require an authenticated tenant token to enumerate. Naming tools
  here would be fabrication, so no rows are asserted. What CAN be stated from the provider's own
  documentation is the binding RULE, recorded in `binding_rule` below, plus the complete REST
  surface those tools are drawn from, recorded in `rest_only` below.
binding_rule:
  statement: >-
    Every MCP tool is backed by an Iru Enterprise API operation and is gated by that operation's
    entry in the API permission grid. Therefore each tool's real input contract is the corresponding
    operation's parameters + requestBody in openapi/kandji-endpoint-management-openapi.json.
  source: https://docs.iru.com/en/endpoint/integrations/ai-assistants/iru-mcp
  confidence: high
mcp_only: []
mcp_only_status: >-
  Unknown until tools/list can be enumerated with a tenant token. Iru documents no server-side
  composite tool, and no non-REST data core (no GraphQL), so an MCP-only tool would have to be a
  composite the provider has not published.

