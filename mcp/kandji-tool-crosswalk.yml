purpose: >-
  Bind the agent-facing MCP tool surface to the machine-readable REST core so a tool inherits a real
  inputSchema from its backing operation instead of a guessed one.
surfaces:
  rest_openapi: openapi/kandji-endpoint-management-openapi.json
  rest_base_url: https://{subdomain}.api.kandji.io  # US; EU is {subdomain}.api.eu.kandji.io
  graphql: null                                     # Iru publishes no GraphQL surface
  mcp: https://YOUR_TENANT.connect.iru.com/mcp-server/connector/kandji/tools
  mcp_gated: true
  rest_gated: true
  note: >-
    Both surfaces are tenant-scoped and token-gated. Iru states the MCP server "exposes the Iru
    Enterprise API surface, structured as MCP tools" and that MCP permissions are selected from the
    SAME per-endpoint permission grid as the REST token — so the MCP tool set is, by the provider's
    own description, a projection of the REST operations below rather than a divergent surface.

