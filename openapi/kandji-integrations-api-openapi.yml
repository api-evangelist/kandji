  /api/v1/integrations/apple/ade/devices:
    get:
      summary: List ADE devices
      description: Get a list of Automated Device Enrollment devices.
      parameters:
      - name: blueprint_id
        in: query
        required: false
        description: Return results "containing" the specified blueprint id
        schema:
          type: string
      - name: user_id
        in: query
        required: false
        description: '"exact" match on user ID value (example: 5344c996-8823-4b37-8d6e-8515fc7c3a0a)'
        schema:
          type: string
      - name: dep_account
        in: query
        required: false
        description: The ADE token UUID
        schema:
          type: string
      - name: device_family
        in: query
        required: false
        description: iPad, iPhone, iPod, Mac, AppleTV, or Vision
        schema:
          type: string
      - name: model
        in: query
        required: false
        description: Return model results "containing" the specified model string. - "iPad (8th Generation)", "MacBook Air"
        schema:
          type: string
      - name: os
        in: query
        required: false
        description: iOS, iPadOS, OSX, tvOS, or visionOS
        schema:
          type: string
      - name: profile_status
        in: query
        required: false
        description: The automated device enrollment profile assignment status - assigned, empty, pushed, removed
        schema:
