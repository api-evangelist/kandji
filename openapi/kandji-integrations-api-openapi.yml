                  description: The default blueprint ID
                phone:
                  type: string
                  description: Phone number
                email:
                  type: string
                  description: Email address
                file:
                  type: string
                  format: binary
                  description: MDM server token file from Apple Business or Apple School Manager
      responses:
        '200':
          description: Create integration
          content:
