  /api/v1/blueprints/{blueprint_id}:
    patch:
      summary: Update Blueprint
      description: This request allows updating of the name, icon, icon color, description, enrollment code, and active status on an existing blueprint.
      parameters:
      - name: blueprint_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the blueprint.
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 6391086e-85a1-4820-813c-f9c75025fff4
                  name: Default Blueprint
                  icon: ss-quote
                  color: orange-500
                  description: An example blueprint description
                  params: {}
                  computers_count: 1
                  missing_computers_count: 1
                  enrollment_code:
                    code: '999858'
                    is_active: false
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not Found
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Update the name of the Blueprint
                color:
                  type: string
                  description: Update the color of the Blueprint icon. A list of possible color codes can be found at https://github.com/kandji-inc/support/wiki/Blueprint-API---Color-Codes. Color will be ignored for the map type.
                description:
                  type: string
                  description: Update the description of the Blueprint
                enrollment_code.code:
                  type: string
                  description: Update the enrollment code of the Blueprint
                enrollment_code.is_active:
                  type: boolean
                  description: Disable the Blueprint for manual device enrollment from the enrollment portal
                icon:
                  type: string
                  description: Update the Blueprint icon. A list of possible icon codes can be found at https://github.com/kandji-inc/support/wiki/Blueprint-API-Icon-Codes. Icon will be ignored for the map type.
      tags:
      - Blueprints
    get:
      summary: Get Blueprint
      description: This request returns information about a specific blueprint based on blueprint ID.
      parameters:
      - name: blueprint_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the blueprint.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                example:
                  id: b38787e4-401c-4c4b-86dc-f1cca2072531
                  name: auto_app_testing
                  icon: ss-paintdisabled
                  color: aqua-500
                  description: ''
                  params: {}
                  computers_count: 0
                  enrollment_code:
                    code: '752477'
                    is_active: true
                  type: classic
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not Found
      tags:
      - Blueprints
    delete:
      summary: Delete Blueprint
      description: This is a HIGHLY destructive action - deleting a Blueprint will un-manage ALL devices assigned to the Blueprint.
      parameters:
      - name: blueprint_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the blueprint.
      responses:
        '204':
          description: Blueprint deleted successfully
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not Found
      tags:
      - Blueprints
  /api/v1/blueprints/{blueprint_id}/assign-library-item:
    post:
      summary: Assign Library Item
      description: This endpoint allows assigning a library item to a specific blueprint (classic and maps).
      parameters:
      - name: blueprint_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the blueprint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                library_item_id:
                  type: string
                  description: 'The unique identifier of the library item to assign. Example: `12345678-1234-1234-1234-123456789012`'
                assignment_node_id:
                  type: string
                  description: 'The assignment node ID for maps. Not required for classic blueprints or maps without conditional logic. Example: `node-123`'
              required:
              - library_item_id
            example:
              library_item_id: 12345678-1234-1234-1234-123456789012
              assignment_node_id: node-123
      responses:
        '200':
          description: success - classic
          content:
            application/json:
              schema:
                type: object
                example:
                - c0148e35-c734-4402-b2fb-1c61aab72550
                - a6063468-48aa-4e52-a098-fd9c7902201e
                - e3d94912-d8bd-474b-9b90-c32288f84f99
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not Found
      tags:
      - Blueprints
  /api/v1/blueprints/{blueprint_id}/list-library-items:
    get:
      summary: List Library Items
      description: This API endpoint retrieves a list of library items associated with a specific blueprint (classic and maps).
      parameters:
      - name: blueprint_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the blueprint.
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: The total count of library items
                  next:
                    type:
                    - string
                    - 'null'
                    description: The URL for the next page of results, if available. If not available will value will be null
                  previous:
                    type:
                    - string
                    - 'null'
                    description: The URL for the previous page of results, if available. If not available will value will be null
                  results:
                    type: array
                    description: An array containing library item objects
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The ID of the library item
                        name:
                          type: string
                          description: The name of the library item
              example:
                count: 3
                next: null
                previous: null
                results:
                - id: 12345678-1234-1234-1234-123456789012
                  name: Custom App Example
                - id: 87654321-4321-4321-4321-210987654321
                  name: Custom Profile Example
                - id: 11111111-2222-3333-4444-555555555555
                  name: Custom Script Example
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not Found
      tags:
      - Blueprints
