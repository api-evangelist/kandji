  /api/v1/devices:
    get:
      summary: List Devices
      description: This request returns a list of devices in an Iru Endpoint Management tenant.
      parameters:
      - name: asset_tag
        in: query
        required: false
        description: Filter by asset tag
        schema:
          type: string
      - name: blueprint_id
        in: query
        required: false
        description: Return results "containing" the specified blueprint id
        schema:
          type: string
      - name: device_id
        in: query
        required: false
        description: Filter by device ID
        schema:
          type: string
      - name: device_name
        in: query
        required: false
        description: Filter by device name
        schema:
          type: string
      - name: filevault_enabled
        in: query
        required: false
        description: Query for devices that either have FileVault on (true) or off (false). This parameter only applies to macOS. An empty list will be returned if no devices are found with the given parameter value.
        schema:
          type: string
      - name: mac_address
        in: query
        required: false
        description: Search for a specific device by MAC address
        schema:
          type: string
      - name: model
        in: query
        required: false
        description: Return model results "containing" the specified model string
        schema:
          type: string
      - name: ordering
        in: query
        required: false
        description: The ordering parameter can be used to define how the device records are ordered in the response. Prepending a dash (-) to the parameter value will reverse the order of the returned results. Possible values are asset_tag, blueprint_id, device_id, device_name, last_check_in, model, platform, os_version, serial_number, user. Multiple values can be combined in a comma separated list.
        schema:
          type: string
      - name: os_version
        in: query
        required: false
        description: Return all device records containing the specified OS version
        schema:
          type: string
      - name: platform
        in: query
        required: false
        description: Return all records matching a specific platform. Possible values are Mac, iPad, iPhone, AppleTV
        schema:
          type: string
      - name: serial_number
        in: query
        required: false
        description: Search for a specific device by Serial Number. If partial serial number is provided in the query, all device containing the partial string will be returned
        schema:
          type: string
      - name: tag_name
        in: query
        required: false
        description: Return results for given tag name. Case sensitive
        schema:
          type: string
      - name: tag_name_in
        in: query
        required: false
        description: Return results for given tag names separate by commas. Case sensitive
        schema:
          type: string
      - name: tag_id
        in: query
        required: false
        description: Search for a tag by its ID. Case sensitive
        schema:
          type: string
      - name: tag_id_in
        in: query
        required: false
        description: Return results for given tag IDs separated by commas. Case sensitive
        schema:
          type: string
      - name: user
        in: query
        required: false
        description: Return results "containing" the user name
        schema:
          type: string
      - name: user_email
        in: query
        required: false
        description: Return results "containing" search on email address
        schema:
          type: string
      - name: user_email_exact
        in: query
        required: false
        description: Return results "matching" the specified email address
        schema:
          type: string
      - name: user_id
        in: query
        required: false
        description: exact match on kandji user ID
        schema:
          type: string
      - name: user_name
        in: query
        required: false
        description: Return results "containing" the assigned user Display Name
        schema:
          type: string
      - name: limit
        in: query
        required: true
        description: A hard upper limit is set at 300 device records returned per request. If more device records are expected, pagination should be used using the limit and offset parameters. Additionally, parameter queries can be added to a request to limit the results.
        schema:
          type: string
      - name: offset
        in: query
        required: false
        description: Specify the starting record to return
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not Found
      tags:
      - Devices
