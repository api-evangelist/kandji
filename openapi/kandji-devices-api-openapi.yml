  /api/v1/devices/{device_id}/secrets/bypasscode:
    get:
      summary: Get Activation Lock Bypass Code
      description: This request allows you to retrieve the Activation Lock Bypass code.
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_based_albc:
                    type: string
                    description: The user-based Activation Lock bypass code for when Activation Lock is enabled using a personal Apple ID and Find My
                    example: A00M6-04XTY-YDMG-JNTE-EMZ3-FTJ5
                  device_based_albc:
                    type: string
                    description: The device-based Activation Lock bypass code for when Activation Lock is enabled by the MDM server
                    example: A00M6-04XTY-YDMG-JNTE-EMZ3-FTJ5
                required:
                - user_based_albc
                - device_based_albc
              example:
                user_based_albc: A00M6-04XTY-YDMG-JNTE-EMZ3-FTJ5
                device_based_albc: A00M6-04XTY-YDMG-JNTE-EMZ3-FTJ5
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not Found
      tags:
      - Devices
