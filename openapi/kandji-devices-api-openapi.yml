  /api/v1/devices/{device_id}/details/lostmode:
    get:
      summary: Get device lost mode details
      description: This request returns lost mode details for a device.
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Lost mode details
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_id:
                    type: string
                    description: The unique identifier of the device
                  lost_mode:
                    type: object
                    properties:
                      lost_mode_status:
                        type: string
                        description: The current status of Lost Mode
                        enum:
                        - ENABLED
                        - DISABLED
                      enabled_by:
                        type: string
                        description: The user who enabled Lost Mode
                      enable_status_at:
                        type: string
                        format: date-time
                        description: When Lost Mode was enabled
                      lock_screen_message:
                        type: string
                        description: The message displayed on the lock screen
                      lock_screen_phone_number:
                        type: string
                        description: The phone number displayed on the lock screen
                      lock_screen_footnote:
                        type: string
                        description: The footnote displayed on the lock screen
                      disable_status:
                        type: string
                        description: The status of disabling Lost Mode
                      disabled_by:
                        type: string
                        description: The user who disabled Lost Mode
                      disable_status_at:
                        type: string
                        format: date-time
                        description: When Lost Mode was disabled
                      last_location_status:
                        type: string
                        description: The status of the last location update
                        enum:
                        - SUCCESS
                        - FAILED
                      last_location_status_at:
                        type: string
                        format: date-time
                        description: When the last location status was updated
                      last_location:
                        type: object
                        properties:
                          latitude:
                            type: string
                            description: The latitude of the last known location
                          longitude:
                            type: string
                            description: The longitude of the last known location
                      last_location_at:
                        type: string
                        format: date-time
                        description: When the last location was recorded
                      sound_status:
                        type: string
                        description: The status of the Lost Mode sound
                        enum:
                        - SUCCESS
                        - FAILED
                      sound_status_at:
                        type: string
                        format: date-time
                        description: When the sound status was last updated
              example:
                device_id: 4820db3b-dec7-40b2-9c8f-eb771ac1a250
                lost_mode:
                  lost_mode_status: ENABLED
                  enabled_by: Accuhive Admin
                  enable_status_at: '2022-12-13T20:19:08.116096Z'
                  lock_screen_message: Hey i just did this from the enable lost mode API
                  lock_screen_phone_number: '1234567890'
                  lock_screen_footnote: This is an example footnote.
                  disable_status: ''
                  disabled_by: ''
                  disable_status_at: ''
                  last_location_status: SUCCESS
                  last_location_status_at: '2022-12-13T20:20:10.103693Z'
                  last_location:
                    latitude: '33.93410519355257'
                    longitude: '-84.47411387632086'
                  last_location_at: '2022-12-13T20:20:10.093380Z'
                  sound_status: SUCCESS
                  sound_status_at: '2022-12-13T20:21:38.992261Z'
      tags:
      - Devices
    delete:
      summary: Cancel Lost Mode
      description: This endpoint can be used to send a cancelation request if Lost Mode is in an error state for a given iOS or iPadOS device.
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Lost Mode cancellation request sent successfully
          content:
