  /api/v1/devices/{device_id}/action/deleteuser:
    post:
      summary: Delete device user
      description: This endpoint sends an MDM command to delete a local user account on macOS and Shared iPad.
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                DeleteAllUsers:
                  type: boolean
                  description: Delete all users on the device
                ForceDeletion:
                  type: boolean
                  description: Force deletion of the user
                UserName:
                  type: string
                  description: Username of the user to delete
      responses:
        '200':
          description: User deletion command sent successfully
          content:
            application/json:
              schema:
                type: object
      tags:
      - Devices
