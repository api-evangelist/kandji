format_note: >-
  NOT RFC 9457. Every error response in the Iru Endpoint Management API is application/json with a
  single-field envelope {"error": "<message>"} (components.schemas.Error declares
  {error: string}). There is no `type` URI, no `title`, no `detail`, no `instance`, and no
  machine-readable application error code anywhere in the spec — the string message is the only
  signal. Agents cannot branch on an error code; they must branch on HTTP status.
envelope:
  content_type: application/json
  schema: '#/components/schemas/Error'
  fields:
  - name: error
    type: string
    description: Human-readable error message.
